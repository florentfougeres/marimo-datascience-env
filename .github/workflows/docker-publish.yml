name: Docker Publish

on:
  push:
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/docker-publish.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ docker.DOCKER_USERNAME }}
          password: ${{ docker.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ docker.DOCKER_USERNAME }}/marimo-geodatapy:latest .
          docker push ${{ docker.DOCKER_USERNAME }}/marimo-geodatapy:latest
